# BREAK #2: switch the EC2NodeClass from instanceProfile (pre-created)
# to role-mode — Karpenter must now CREATE an instance profile at
# runtime... which the explicit-deny (our fake SCP) forbids.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "KarpenterNodeRole-${CLUSTER_NAME}"   # ← runtime IAM write incoming
  amiSelectorTerms:
    - alias: "al2023@latest"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
